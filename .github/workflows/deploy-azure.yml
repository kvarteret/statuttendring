name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Deploy production site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Verify public site matches source
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 \
              "https://statuttendring.samfunnetibergen.no/?deployment=${GITHUB_SHA}" \
              --output /tmp/deployed-index.html && cmp --silent index.html /tmp/deployed-index.html; then
              echo "Public site matches commit ${GITHUB_SHA}."
              exit 0
            fi
            sleep 5
          done
          echo 'Public site does not match the deployed source.' >&2
          exit 1
